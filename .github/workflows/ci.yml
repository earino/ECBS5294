name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary: catch dependency/lockfile rot between semesters
    - cron: "0 6 * * 1"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows consoles default to cp1252, which cannot print the ✅/❌
      # glyphs the course scripts use
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true

      - name: Sync environment (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Import smoke test
        run: uv run python -c "import sys, pandas, numpy, duckdb, requests, matplotlib; assert sys.version_info[:2] == (3, 13), sys.version; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| duckdb', duckdb.__version__)"

      - name: Validate notebook format
        shell: bash
        run: uv run python scripts/validate_notebook_format.py $(git ls-files 'notebooks/**/*.ipynb' 'assignments/**/*.ipynb')

      - name: Syntax-check starters and TODO exercises
        run: uv run python scripts/check_starter_syntax.py

      - name: Verify solution ZIP encryption
        run: uv run python scripts/check_solution_zips.py

      - name: Documentation consistency
        run: uv run python scripts/check_doc_consistency.py

      - name: Dataset invariants and offline backup
        run: uv run pytest tests/ -q

      - name: Execute all teaching notebooks
        run: uv run python scripts/execute_notebooks.py

  verify-solutions:
    # Decrypts and executes every solution notebook. Runs only where the
    # SOLUTION_PASSWORDS secret exists (skipped cleanly on forks).
    name: verify-solutions
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true

      - name: Sync environment
        run: uv sync --locked

      - name: Decrypt and execute all solutions
        env:
          SOLUTION_PASSWORDS: ${{ secrets.SOLUTION_PASSWORDS }}
        run: |
          if [ -z "$SOLUTION_PASSWORDS" ]; then
            echo "SOLUTION_PASSWORDS secret not available (fork?) — skipping."
            exit 0
          fi
          uv run python scripts/ci_run_solutions.py
